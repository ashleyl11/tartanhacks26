<!DOCTYPE HTML>
<html>
<head>

            max-height: 600px;

        }

</head>
<body class="is-preload">
    <div id="state-loader">
        <div class="loader-ring"></div>
        <p id="loader-text">
            <span class="loader-message">Loading</span><span class="dots"></span>
        </p>

    </div>


    <div id="page-wrapper">
        <header id="header">
            <h1><a href="index.html">SOLID STATE</a></h1>
            <nav><a href="#menu">Menu</a></nav>
        </header>

        <section id="wrapper">
            <header>
                <div class="inner">
                    <h2>District Legislation Tracker</h2>
                    <p>Click a state to fetch real-time data from Plural Policy.</p>
                </div>
            </header>

            <div class="wrapper">
                <div class="inner">
                    <div class="row">
                        <div class="col-7 col-12-medium">
                            <h3 class="major">Interactive Map</h3>
                            <div id="map"></div>
                        </div>

                        <div class="col-5 col-12-medium">
                            <h3 class="major" id="district-title">Select a Region</h3>
                            <div id="legislation-list">
                            </div>
                        
                        <ul class="actions stacked" id="view-more-container" style="display:none; margin-top: 2rem;">
                            <li>
                                <a id="view-more-link" href="allbills.html" class="button fit">Explore All State Bills</a>
                            </li>
                        </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.scrollex.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="config.js"></script>

    <script>
let selectedLayer = null;

const stateStyle = {
  fillColor: "#4c5c96",
  weight: 1,
  color: "white",
  fillOpacity: 0.3
};

const hoverStyle = {
  fillOpacity: 0.75,
  color: "#ffffff"
};

const selectedStyle = {
  fillColor: "#8fa2ff",
  fillOpacity: 0.9,
  weight: 2,
  color: "#ffffff"
};


let loaderTimeout;

function showLoader(stateName) {
  const loader = document.getElementById("state-loader");
  const text = document.querySelector(".loader-message");

  loader.classList.add("active");

  // Reset animation
  text.style.animation = "none";
  text.textContent = `Loading ${stateName}`;

  // Force reflow
  void text.offsetHeight;

  // Animate in
  text.style.animation = "loaderTextIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards";

  loaderTimeout = setTimeout(() => {
    // Animate out
    text.style.animation = "loaderTextOut 0.45s ease forwards";

    setTimeout(() => {
      text.style.animation = "none";
      text.textContent = `Still working on ${stateName}`;

      void text.offsetHeight;

      text.style.animation =
        "loaderTextIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards";
    }, 450);
  }, 4000);
}





function hideLoader() {
  clearTimeout(loaderTimeout);
  document.getElementById("state-loader").classList.remove("active");
}



      // --- 1. THE CONFIG & MAP ---
const PLURAL_API_KEY = 'a966b62f-c200-468a-a737-c7e5da4dfbbd'; 


      // --- 1. THE CONFIG & MAP ---
const stateMap = {
    "Alabama": "al", "Alaska": "ak", "Arizona": "az", "Arkansas": "ar", "California": "ca",
    "Colorado": "co", "Connecticut": "ct", "Delaware": "de", "Florida": "fl", "Georgia": "ga",
    "Hawaii": "hi", "Idaho": "id", "Illinois": "il", "Indiana": "in", "Iowa": "ia",
    "Kansas": "ks", "Kentucky": "ky", "Louisiana": "la", "Maine": "me", "Maryland": "md",
    "Massachusetts": "ma", "Michigan": "mi", "Minnesota": "mn", "Mississippi": "ms", "Missouri": "mo",
    "Montana": "mt", "Nebraska": "ne", "Nevada": "nv", "New Hampshire": "nh", "New Jersey": "nj",
    "New Mexico": "nm", "New York": "ny", "North Carolina": "nc", "North Dakota": "nd", "Ohio": "oh",
    "Oklahoma": "ok", "Oregon": "or", "Pennsylvania": "pa", "Rhode Island": "ri", "South Carolina": "sc",
    "South Dakota": "sd", "Tennessee": "tn", "Texas": "tx", "Utah": "ut", "Vermont": "vt",
    "Virginia": "va", "Washington": "wa", "West Virginia": "wv", "Wisconsin": "wi", "Wyoming": "wy"
};

// Initialize Map with special options for heavy themes
const map = L.map('map', {
  dragging: true,
  scrollWheelZoom: false, // keep zoom OFF
  doubleClickZoom: false,
  tap: false,
  inertia: true
}).setView([37.8, -96], 4);

map.getContainer().addEventListener("wheel", function (e) {
  e.preventDefault();

  const deltaX = e.deltaX;
  const deltaY = e.deltaY;

  // Pan speed (tweak if needed)
  const panFactor = 1;

  map.panBy([deltaX * panFactor, deltaY * panFactor], {
    animate: false
  });
}, { passive: false });



L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; CARTO'
}).addTo(map);

// IMPORTANT: Tell the theme not to intercept clicks on the map div
const mapDiv = document.getElementById('map');
L.DomEvent.disableClickPropagation(mapDiv);
        


const apikey= CONFIG.PLURAL_API_KEY;

// --- 2. FETCH FUNCTION (Guaranteed Fallback) ---
async function loadBills(stateName) {
    const listDiv = document.getElementById('legislation-list');
    const stateId = stateMap[stateName];
    if (!stateId) return;

    showLoader(stateName); // 👈 SHOW LOADER

    listDiv.innerHTML = '<p class="loading-text">Fetching legislation…</p>';

    try {
        const jurisdictionId = `ocd-jurisdiction/country:us/state:${stateId}/government`;
        const targetUrl = `https://v3.openstates.org/bills?jurisdiction=${encodeURIComponent(jurisdictionId)}&sort=updated_desc&per_page=5&apikey=${PLURAL_API_KEY}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
            let html = "";
            data.results.forEach(bill => {
              // We send the bill ID and the jurisdiction through the URL
              const stateId = stateMap[stateName];
              const detailLink = `details.html?bill_id=${bill.identifier}&state=${stateId}`;

              html += `
                  <div class="legislation-card">
                      <h4>${bill.identifier}</h4>
                      <p>${bill.title.substring(0, 100)}...</p>
                      <ul class="actions">
                          <li><a href="${detailLink}" class="button primary small">View Details</a></li>
                      </ul>
                  </div>`;
            });
            const viewMoreContainer = document.getElementById('view-more-container');
            const viewMoreLink = document.getElementById('view-more-link');

            viewMoreContainer.style.display = 'block';
            viewMoreLink.href = `allbills.html?state=${stateId}`;
            listDiv.innerHTML = html;
        } else {
            listDiv.innerHTML = `<p>No recent activity found for ${stateName}.</p>`;
        }
    } catch (err) {
        listDiv.innerHTML = "<p>API Error. Check console (F12).</p>";
    } finally {
        hideLoader(); // 👈 ALWAYS HIDE LOADER
    }
}

// --- 3. INTERACTIONS ---
let geojson;
let activeLabel = null;
let activeLayer = null;

function highlightState(layer) {
  if (activeLayer && activeLayer !== layer) {
    geojson.resetStyle(activeLayer);
  }
  if (activeLabel) map.removeLayer(activeLabel);

  layer.setStyle({
    fillColor: '#8fa2ff',
    fillOpacity: 0.8,
    color: 'white',
    weight: 2
  });

  activeLayer = layer;
}




function onEachFeature(feature, layer) {
    layer.on({
        mouseover: (e) => {
            if (activeLayer !== e.target) e.target.setStyle({ fillOpacity: 0.8, color: '#fff' });
        },
        mouseout: (e) => {
            if (activeLayer !== e.target) geojson.resetStyle(e.target);
        },
        click: (e) => {
            L.DomEvent.stopPropagation(e);

            const stateName = feature.properties.name;
            document.getElementById('district-title').innerText = stateName;

            loadBills(stateName);
            map.fitBounds(e.target.getBounds());

            highlightState(e.target); // handle highlight + label
        }
    });
}




// --- 4. LOAD DATA ---
fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
    .then(res => res.json())
    .then(data => {
        geojson = L.geoJSON(data, {
        style: { fillColor: "#4c5c96", weight: 1, color: 'white', fillOpacity: 0.3 },
        onEachFeature: function(feature, layer) {
            onEachFeature(feature, layer); // your hover/click handlers
        }
    }).addTo(map);


    });

layer.getElement()?.classList.add("selected");


// THE THEME FIX: Wait for Solid State's animations to finish before sizing the map
window.addEventListener('load', () => {
    setTimeout(() => { map.invalidateSize(); }, 500);
});

    </script>
</body>
</html>
