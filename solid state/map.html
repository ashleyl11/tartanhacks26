<!DOCTYPE HTML>
<html>
<head>
    <title>Map - Solid State</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        /* Ensuring the map is visible and matches the theme */
        #map {
            height: 500px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #2e3450; /* Solid State dark blue */
        }
        .legislation-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid #4c5c96;
        }
        #legislation-list {
            max-height: 419px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .loading-text {
            font-style: italic;
            color: #4c5c96;
        }
    </style>
</head>
<body class="is-preload">
    <div id="state-loader">
        <div class="loader-ring"></div>
        <p id="loader-text">
            <span class="loader-message">Loading</span><span class="dots"></span>
        </p>

    </div>


    <div id="page-wrapper">
        <header id="header">
            <h1><a href="index.html">SOLID STATE</a></h1>
            <nav><a href="#menu">Menu</a></nav>
        </header>

        <nav id="menu">
            <div class="inner">
                <h2>Menu</h2>
                <ul class="links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="test2.html">Interactive Map</a></li>
                    <li><a href="allbills.html">All Recent Legislation</a></li>
                    <!-- <li><a href="#">Log In</a></li>
                    <li><a href="#">Sign Up</a></li> -->
                </ul>
                <a href="#" class="close">Close</a>
            </div>
        </nav>

        <section id="wrapper">
            <header>
                <div class="inner">
                    <h2>District Legislation Tracker</h2>
                    <p>Click a state to fetch real-time data from Plural Policy.</p>
                </div>
            </header>

            <div class="wrapper">
                <div class="inner">
                    <div class="row">
                        <div class="col-7 col-12-medium">
                            <h3 class="major">Interactive Map</h3>
                            <div id="map"></div>
                        </div>

                        <div class="col-5 col-12-medium">
                        <!-- Dropdown heading & list -->
                        <div class="state-select minimal">
                            <h3 class="major state-trigger" id="district-title">
                                Select a Region <span class="caret">▾</span>
                            </h3>
                            <ul class="state-options" id="stateOptions"></ul>
                        </div>

                        <div id="legislation-list"></div>

                        <ul class="actions stacked" id="view-more-container" style="display:none; margin-top: 2rem;">
                            <li>
                                <a id="view-more-link" href="allbills.html" class="button fit">Explore All State Bills</a>
                            </li>
                        </ul>
                    </div>

                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.scrollex.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="config.js"></script>

    <script>
let selectedLayer = null;
let selectedStateName = null;

// --- STYLES ---
const stateStyle = {
  fillColor: "#4c5c96",
  weight: 1,
  color: "white",
  fillOpacity: 0.3
};

const hoverStyle = {
  fillOpacity: 0.75,
  color: "#ffffff"
};

const selectedStyle = {
  fillColor: "#8fa2ff",
  fillOpacity: 0.9,
  weight: 2,
  color: "#ffffff"
};

// --- LOADER FUNCTIONS ---
let loaderTimeout;
function showLoader(stateName) {
  const loader = document.getElementById("state-loader");
  const text = document.querySelector(".loader-message");

  loader.classList.add("active");
  text.style.animation = "none";
  text.textContent = `Loading ${stateName}`;
  void text.offsetHeight;
  text.style.animation = "loaderTextIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards";

  loaderTimeout = setTimeout(() => {
    text.style.animation = "loaderTextOut 0.45s ease forwards";
    setTimeout(() => {
      text.style.animation = "none";
      text.textContent = `Still working on ${stateName}`;
      void text.offsetHeight;
      text.style.animation =
        "loaderTextIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards";
    }, 450);
  }, 4000);
}

function hideLoader() {
  clearTimeout(loaderTimeout);
  document.getElementById("state-loader").classList.remove("active");
}

      // --- 1. THE CONFIG & MAP ---
const PLURAL_API_KEY = CONFIG.PLURAL_API_KEY; 


      // --- 1. THE CONFIG & MAP ---
const stateMap = {
    "Alabama": "al", "Alaska": "ak", "Arizona": "az", "Arkansas": "ar", "California": "ca",
    "Colorado": "co", "Connecticut": "ct", "Delaware": "de", "Florida": "fl", "Georgia": "ga",
    "Hawaii": "hi", "Idaho": "id", "Illinois": "il", "Indiana": "in", "Iowa": "ia",
    "Kansas": "ks", "Kentucky": "ky", "Louisiana": "la", "Maine": "me", "Maryland": "md",
    "Massachusetts": "ma", "Michigan": "mi", "Minnesota": "mn", "Mississippi": "ms", "Missouri": "mo",
    "Montana": "mt", "Nebraska": "ne", "Nevada": "nv", "New Hampshire": "nh", "New Jersey": "nj",
    "New Mexico": "nm", "New York": "ny", "North Carolina": "nc", "North Dakota": "nd", "Ohio": "oh",
    "Oklahoma": "ok", "Oregon": "or", "Pennsylvania": "pa", "Rhode Island": "ri", "South Carolina": "sc",
    "South Dakota": "sd", "Tennessee": "tn", "Texas": "tx", "Utah": "ut", "Vermont": "vt",
    "Virginia": "va", "Washington": "wa", "West Virginia": "wv", "Wisconsin": "wi", "Wyoming": "wy"
};

// --- INITIALIZE MAP ---
const map = L.map('map', {
  dragging: true,
  scrollWheelZoom: false,
  doubleClickZoom: false,
  tap: false,
  inertia: true
}).setView([37.8, -96], 4);

map.getContainer().addEventListener("wheel", function (e) {
  e.preventDefault();
  const deltaX = e.deltaX;
  const deltaY = e.deltaY;
  const panFactor = 1;
  map.panBy([deltaX * panFactor, deltaY * panFactor], { animate: false });
}, { passive: false });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; CARTO'
}).addTo(map);

const mapDiv = document.getElementById('map');
L.DomEvent.disableClickPropagation(mapDiv);

// --- FETCH BILLS ---
async function loadBills(stateName) {
    const listDiv = document.getElementById('legislation-list');
    const stateId = stateMap[stateName];
    if (!stateId) return;

    showLoader(stateName);
    listDiv.innerHTML = '<p class="loading-text">Fetching legislation…</p>';

    try {
        const jurisdictionId = `ocd-jurisdiction/country:us/state:${stateId}/government`;
        const targetUrl = `https://v3.openstates.org/bills?jurisdiction=${encodeURIComponent(jurisdictionId)}&sort=updated_desc&per_page=5&apikey=${PLURAL_API_KEY}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
            let html = "";
            data.results.forEach(bill => {
              const stateId = stateMap[stateName];
              const detailLink = `details.html?bill_id=${bill.identifier}&state=${stateId}`;
              html += `
                  <div class="legislation-card">
                      <h4>${bill.identifier}</h4>
                      <p>${bill.title.substring(0, 100)}...</p>
                      <ul class="actions">
                          <li><a href="${detailLink}" class="button primary small">View Details</a></li>
                      </ul>
                  </div>`;
            });
            const viewMoreContainer = document.getElementById('view-more-container');
            const viewMoreLink = document.getElementById('view-more-link');
            viewMoreContainer.style.display = 'block';
            viewMoreLink.href = `allbills.html?state=${stateId}`;
            listDiv.innerHTML = html;
        } else {
            listDiv.innerHTML = `<p>No recent activity found for ${stateName}.</p>`;
        }
    } catch (err) {
        listDiv.innerHTML = "<p>API Error. Check console (F12).</p>";
    } finally {
        hideLoader();
    }
}

// --- MAP INTERACTIONS ---
let geojson;
let activeLayer = null;

function highlightState(layer) {
  if (activeLayer && activeLayer !== layer) geojson.resetStyle(activeLayer);
  layer.setStyle({ fillColor: '#8fa2ff', fillOpacity: 0.8, color: 'white', weight: 2 });
  activeLayer = layer;
}

function onEachFeature(feature, layer) {
    layer.on({
        mouseover: (e) => { if (activeLayer !== e.target) e.target.setStyle({ fillOpacity: 0.8, color: '#fff' }); },
        mouseout: (e) => { if (activeLayer !== e.target) geojson.resetStyle(e.target); },

        click: (e) => {
            L.DomEvent.stopPropagation(e);
            const stateName = feature.properties.name;
 

            // Update dropdown and map/bills
            dropdownBtn.innerHTML = `${stateName} <span class="caret">▾</span>`;
            loadBills(stateName);
            geojson.eachLayer(layer => {
                if (layer.feature.properties.name === stateName) {
                    map.fitBounds(layer.getBounds());
                    highlightState(layer);
                }
            });
        }
    });
}

// --- LOAD GEOJSON ---
fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
    .then(res => res.json())
    .then(data => {
        geojson = L.geoJSON(data, {
            style: stateStyle,
            onEachFeature: onEachFeature
        }).addTo(map);
    });

// --- THEME FIX ---
window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 500));

// --------------------
// DROPDOWN LOGIC
// --------------------
const dropdown = document.querySelector(".state-select");
const dropdownBtn = document.querySelector(".state-trigger");
const optionsList = document.getElementById("stateOptions");

// Populate dropdown
Object.keys(stateMap).forEach(stateName => {
    const li = document.createElement("li");
    li.textContent = stateName;
    li.dataset.state = stateName;
    optionsList.appendChild(li);
});

// Toggle dropdown
dropdownBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("open");
});

// Close dropdown outside click
document.addEventListener("click", () => dropdown.classList.remove("open"));

// Select from dropdown
optionsList.addEventListener("click", (e) => {
    const li = e.target.closest("li");
    if (!li) return;

    const state = li.dataset.state;
    dropdownBtn.innerHTML = `${state} <span class="caret">▾</span>`;
    dropdown.classList.remove("open");
    loadBills(state);

    if (geojson) {
        geojson.eachLayer(layer => {
            if (layer.feature.properties.name === state) {
                map.fitBounds(layer.getBounds());
                highlightState(layer);
            }
        });
    }
});
</script>

</body>
</html>
