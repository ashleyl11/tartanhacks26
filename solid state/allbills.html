<!DOCTYPE HTML>
<html>
<head>
    <title>All Legislation - Solid State</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    <style>
        /* Extra styling for the selection area */
        #selector-area { margin-bottom: 2rem; padding: 2rem; background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        .hidden { display: none !important; }
        /* Ensure the grid doesn't collapse */
        #bill-grid { min-height: 200px; }
        /* Center the load more button */
        #load-more-container { text-align: center; margin-top: 2rem; padding-bottom: 2rem; }
    </style>
</head>
<body class="is-preload">
    <div id="state-loader">
        <div class="loader-ring"></div>
        <p id="loader-text">
            <span class="loader-message">Loading </span><span class="dots"></span>
        </p>
    </div>


    <div id="page-wrapper">
        <header id="header">
            <h1><a href="index.html">Legislation Tracker</a></h1>
            <nav><a href="#menu">Menu</a></nav>
        </header>

        <nav id="menu">
            <div class="inner">
                <h2>Menu</h2>
                <ul class="links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="map.html">Interactive Map</a></li>
                    <li><a href="allbills.html">All Recent Legislation</a></li>
                    <li><a href="contact.html">Contact Representative</a></li>
                    <li><a href="legislators.html">Search Legislators</a></li>
                    <!-- <li><a href="#">Log In</a></li>
                    <li><a href="#">Sign Up</a></li> -->
                </ul>
                <a href="#" class="close">Close</a>
            </div>
        </nav>

        <section id="wrapper">
            <header>
                <div class="inner">
                    <h2 id="state-page-title">Legislation Explorer</h2>
                    <p>Search and browse recent legislative activity across the country.</p>
                </div>
            </header>

            <div class="wrapper">
                <div class="inner">
                    
                    <div id="selector-area">
                        <div class="row gtr-uniform">
                            <div class="col-6 col-12-xsmall" id="state-select-container">
                                <label for="state-dropdown">Select a State</label>
                                <select id="state-dropdown" onchange="handleStateChange()">
                                    <option value="">- Choose State -</option>
                                </select>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="search-input">Filter by Keyword</label>
                                <input type="text" id="search-input" placeholder="e.g. Education, Health..." onkeyup="filterBills()">
                            </div>
                        </div>
                    </div>

                    <h3 class="major" id="grid-header">Recent Laws</h3>
                    
                    <section class="features" id="bill-grid">
                        </section>

                    <div id="load-more-container" class="hidden">
                        <button id="load-more-btn" class="button primary" onclick="loadMoreBills()">Load More Laws</button>
                    </div>

                    <ul class="actions" style="margin-top: 3rem; border-top: solid 2px rgba(255, 255, 255, 0.1); padding-top: 2rem;">
                        <li><a href="map.html" class="button">Back to Map</a></li>
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="config.js"></script>

    <script>
        const PLURAL_API_KEY = CONFIG.PLURAL_API_KEY;
        
        let allLoadedBills = []; 
        let currentPage = 1;
        let isFetching = false;

        const stateMap = {
            "al": "Alabama", "ak": "Alaska", "az": "Arizona", "ar": "Arkansas", "ca": "California",
            "co": "Colorado", "ct": "Connecticut", "de": "Delaware", "fl": "Florida", "ga": "Georgia",
            "hi": "Hawaii", "id": "Idaho", "il": "Illinois", "in": "Indiana", "ia": "Iowa",
            "ks": "Kansas", "ky": "Kentucky", "la": "Louisiana", "me": "Maine", "md": "Maryland",
            "ma": "Massachusetts", "mi": "Michigan", "mn": "Minnesota", "ms": "Mississippi", "mo": "Missouri",
            "mt": "Montana", "ne": "Nebraska", "nv": "Nevada", "nh": "New Hampshire", "nj": "New Jersey",
            "nm": "New Mexico", "ny": "New York", "nc": "North Carolina", "nd": "North Dakota", "oh": "Ohio",
            "ok": "Oklahoma", "or": "Oregon", "pa": "Pennsylvania", "ri": "Rhode Island", "sc": "South Carolina",
            "sd": "South Dakota", "tn": "Tennessee", "tx": "Texas", "ut": "Utah", "vt": "Vermont",
            "va": "Virginia", "wa": "Washington", "wv": "West Virginia", "wi": "Wisconsin", "wy": "Wyoming"
        };

        function populateDropdown() {
            const dropdown = document.getElementById('state-dropdown');
            for (let code in stateMap) {
                let opt = document.createElement('option');
                opt.value = code;
                opt.innerHTML = stateMap[code];
                dropdown.appendChild(opt);
            }
        }

        function handleStateChange() {
            const selectedState = document.getElementById('state-dropdown').value;
            if (selectedState) {
                const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?state=' + selectedState;
                window.history.pushState({path:newurl},'',newurl);
                
                // RESET for new state selection
                allLoadedBills = [];
                currentPage = 1;
                loadBills(selectedState, false);
            }
        }

        let loaderTimeout;

        function showLoader(label = "Loading") {
            const loader = document.getElementById("state-loader");
            const text = document.querySelector(".loader-message");

            loader.classList.add("active");

            text.style.animation = "none";
            text.textContent = label;
            void text.offsetHeight;

            text.style.animation =
                "loaderTextIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards";

            loaderTimeout = setTimeout(() => {
                text.style.animation = "loaderTextOut 0.45s ease forwards";

                setTimeout(() => {
                text.style.animation = "none";
                text.textContent = "One moment please…";
                void text.offsetHeight;
                text.style.animation =
                    "loaderTextIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards";
                }, 450);
            }, 4000);
        }

        function hideLoader() {
        clearTimeout(loaderTimeout);
        document.getElementById("state-loader").classList.remove("active");
        }


        async function loadMoreBills() {
            currentPage++;
            const urlParams = new URLSearchParams(window.location.search);
            const stateAbbr = urlParams.get('state');
            await loadBills(stateAbbr, true);
        }

        async function loadBills(stateAbbr, isAppending = false) {
            const stateName = stateMap[stateAbbr] || "Legislation";
            showLoader(`Loading ${stateName}`);


            if (isFetching || !stateAbbr) return;
            isFetching = true;

            const grid = document.getElementById('bill-grid');
            const pageTitle = document.getElementById('state-page-title');
            const loadMoreBtn = document.getElementById('load-more-btn');
            const loadMoreContainer = document.getElementById('load-more-container');

            document.getElementById('state-dropdown').value = stateAbbr;
            const fullStateName = stateMap[stateAbbr] || "State";
            pageTitle.innerText = `${fullStateName} Legislation`;

            if (!isAppending) {
                grid.innerHTML = "<p>Loading laws...</p>";
                loadMoreContainer.classList.add('hidden');
            } else {
                loadMoreBtn.innerText = "Fetching more...";
            }

            try {
                const jurisdictionId = `ocd-jurisdiction/country:us/state:${stateAbbr}/government`;
                
                // Pagination added: page=${currentPage}
                const targetUrl = `https://v3.openstates.org/bills?jurisdiction=${encodeURIComponent(jurisdictionId)}&sort=updated_desc&per_page=20&page=${currentPage}&apikey=${PLURAL_API_KEY}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Could not connect to the API proxy.");
                
                const data = await response.json();

                if (data && data.results && data.results.length > 0) {
                    // Update our data store
                    allLoadedBills = isAppending ? [...allLoadedBills, ...data.results] : data.results;
                    
                    // Render the current view (passing current filter if any)
                    filterBills();

                    // Manage "Load More" button visibility
                    if (data.results.length === 20) {
                        loadMoreContainer.classList.remove('hidden');
                        loadMoreBtn.innerText = "Load More Laws";
                    } else {
                        // Less than 20 items means we hit the end of the list
                        loadMoreContainer.classList.add('hidden');
                    }
                } else {
                    if (!isAppending) {
                        grid.innerHTML = "<p>No laws found for this state.</p>";
                    }
                    loadMoreContainer.classList.add('hidden');
                }
            } catch (err) {
                console.error("Error fetching laws:", err);
                if (!isAppending) {
                    grid.innerHTML = `<p>Error loading legislation: ${err.message}.</p>`;
                }
            } finally {
                hideLoader();
                isFetching = false;
            }
        }

        function renderGrid(bills, state) {
            const grid = document.getElementById('bill-grid');
            if (!bills || bills.length === 0) {
                grid.innerHTML = "<p>No laws match your current filter.</p>";
                return;
            }

            grid.innerHTML = bills.map(bill => {
                const billTitle = bill.title || "No title provided";
                const truncatedTitle = billTitle.length > 150 ? billTitle.substring(0, 150) + "..." : billTitle;
                const latestAction = bill.latest_action ? bill.latest_action.description : 'Recently updated';

                return `
                    <article>
                        <h3 class="major">${bill.identifier}</h3>
                        <p>${truncatedTitle}</p>
                        <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 1rem;">
                            <strong>Last Action:</strong> ${latestAction}
                        </p>
                        <a href="details.html?bill_id=${bill.identifier}&state=${state}" class="special">Learn more</a>
                    </article>
                `;
            }).join('');
        }

        function filterBills() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const urlParams = new URLSearchParams(window.location.search);
            const state = urlParams.get('state');

            const filtered = allLoadedBills.filter(bill => 
                (bill.title && bill.title.toLowerCase().includes(query)) || 
                (bill.identifier && bill.identifier.toLowerCase().includes(query))
            );
            renderGrid(filtered, state);
        }

        window.onload = () => {
            populateDropdown();
            
            const urlParams = new URLSearchParams(window.location.search);
            const stateAbbr = urlParams.get('state');
            if (stateAbbr) {
                loadBills(stateAbbr);
            } else {
                document.getElementById('bill-grid').innerHTML = "<p>Please choose a state above to view recent legislation.</p>";
            }
        };
    </script>
</body>
</html>
