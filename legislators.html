<!DOCTYPE HTML>
<html>
<head>
    <title>Find Legislators by ZIP - Solid State</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    <style>
        #selector-area { margin-bottom: 2rem; padding: 2rem; background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        #results-grid { display: flex; flex-wrap: wrap; gap: 2rem; min-height: 200px; }
        .legislator-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 8px;
            flex: 1 1 300px;
            border-left: 4px solid #888;
        }
        .legislator-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 2px solid rgba(255,255,255,0.2); background: #333; }
        .search-container { display: flex; gap: 10px; align-items: flex-end; }
    </style>
</head>
<body class="is-preload">
    <div id="page-wrapper">

        <header id="header">
            <h1><a href="index.html">Solid State</a></h1>
            <nav>
                <a href="#menu">Menu</a>
            </nav>
        </header>

        <nav id="menu">
            <div class="inner">
                <h2>Menu</h2>
                <ul class="links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="map.html">Interactive Map</a></li>
                    <li><a href="allbills.html">All Recent Legislation</a></li>
                    <li><a href="contact.html">Contact Representative</a></li>
                    <li><a href="legislators.html">Search Legislators</a></li>
                    <!-- <li><a href="#">Log In</a></li>
                    <li><a href="#">Sign Up</a></li> -->
                </ul>
                <a href="#" class="close">Close</a>
            </div>
        </nav>

        <section id="wrapper">
            <header>
                <div class="inner">
                    <h2>Find Your Legislators</h2>
                    <p>Enter your ZIP code to see who represents you at the state level.</p>
                </div>
            </header>
            <div class="wrapper">
                <div class="inner">
                    <div id="selector-area">
                        <div class="row gtr-uniform search-container">
                            <div class="col-8 col-12-xsmall">
                                <label for="zip-input">Enter 5-Digit ZIP Code</label>
                                <input type="text" id="zip-input" placeholder="e.g. 90210" maxlength="5" onkeypress="if(event.key === 'Enter') searchByZip()">
                            </div>
                            <div class="col-4 col-12-xsmall">
                                <button class="button primary fit" onclick="searchByZip()">Search</button>
                            </div>
                        </div>
                    </div>
                    <h3 class="major">Results</h3>
                    <section id="results-grid">
                        <p>Enter a ZIP code above to find your representatives.</p>
                    </section>
                </div>
            </div>
        </section>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="config.js"></script>
    <script>
        const API_KEY = CONFIG.PLURAL_API_KEY;
        let lastSearchTime = 0;

        async function searchByZip() {
            const now = Date.now();
            if (now - lastSearchTime < 2000) return;
            
            const zipInput = document.getElementById('zip-input').value.trim();
            const grid = document.getElementById('results-grid');

            if (zipInput.length < 5) {
                grid.innerHTML = "<p>Please enter a full 5-digit ZIP code.</p>";
                return;
            }

            lastSearchTime = now;
            grid.innerHTML = "<p>Locating ZIP code...</p>";

            try {
                const geoResponse = await fetch(`https://api.zippopotam.us/us/${zipInput}`);
                if (!geoResponse.ok) throw new Error("ZIP not found.");
                const geoData = await geoResponse.json();
                const place = geoData.places[0];
                
                await fetchLegislators(place.latitude, place.longitude, `${place['place name']}, ${place['state abbreviation']}`);
            } catch (err) {
                grid.innerHTML = `<p>Error: ${err.message}</p>`;
            }
        }

        async function fetchLegislators(lat, lng, locationLabel) {
            const grid = document.getElementById('results-grid');
            try {
                const url = `https://v3.openstates.org/people.geo?lat=${parseFloat(lat).toFixed(4)}&lng=${parseFloat(lng).toFixed(4)}&apikey=${API_KEY}`;
                const response = await fetch(url);
                if (response.status === 429) throw new Error("Too many requests. Please wait a minute.");
                if (!response.ok) throw new Error("Search failed.");
                
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    renderLegislators(data.results);
                } else {
                    grid.innerHTML = `<p>No state legislators found for ${locationLabel}.</p>`;
                }
            } catch (err) {
                grid.innerHTML = `<p>${err.message}</p>`;
            }
        }

        function renderLegislators(people) {
            document.getElementById('results-grid').innerHTML = people.map(person => {
                const party = person.party || 'Independent';
                const partyColor = party.includes('Democrat') ? '#3498db' : (party.includes('Republican') ? '#e74c3c' : '#777');
                const role = person.current_role || {};
                
                return `
                    <article class="legislator-card" style="border-left-color: ${partyColor};">
                        <img src="${person.image || ''}" class="legislator-photo" onerror="this.src='https://via.placeholder.com/100?text=No+Photo'">
                        <h3 class="major">${person.name}</h3>
                        <p><strong>${party}</strong><br>${role.org_classification === 'lower' ? 'State Representative' : 'State Senator'}<br>District: ${role.district || 'N/A'}</p>
                        <a href="${person.openstates_url}" target="_blank" class="button small">View Profile</a>
                    </article>`;
            }).join('');
        }
    </script>
</body>
</html>
